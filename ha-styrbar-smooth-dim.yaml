blueprint:
  name: ZHA - IKEA Styrbar (Smooth Dimming + Color Presets, Non-IKEA-light safe)
  description: >
    Control a single light with an IKEA Styrbar remote (Remote Control N2) via ZHA.

    - Up (short press): turn on, always at a configurable default white temperature
      (independent of the color/temp presets below)
    - Down (short press): turn off
    - Up (hold): smooth dim up using a native Zigbee "Move" command (hardware-ramped,
      so it is as smooth as an original IKEA bulb)
    - Down (hold): smooth dim down in small steps, with a configurable floor so the
      light never turns off by accident
    - Left / Right (short press): jump to the previous / next preset in a list of 6
      colors/white temperatures (first 4 are RGB, last 2 are native white
      temperatures). No helper entity required - the automation looks at the
      light's current color mode and value to figure out where it is in the list.
      White presets use the light's native tunable-white channel
      (color_temp_kelvin), not an RGB approximation.
    - Release button: dimming stops immediately

    Dimming up uses a single native Zigbee Level Control "Move" command, which the
    light's own firmware ramps in hardware - this avoids the repeated-command jitter
    that some non-IKEA Zigbee lights (e.g. Aqara LED strips) show with HA-side step
    loops. Dimming down uses a step loop instead, because native Move has no concept
    of a minimum level and would turn the light fully off once it reaches 0.
  domain: automation
  input:
    remote:
      name: Styrbar remote
      description: Select your IKEA Styrbar (Remote Control N2), paired via ZHA.
      selector:
        device:
          integration: zha
          model: Remote Control N2
    light:
      name: Light (entity)
      description: The light entity to control (used for on/off, dim-down, and colors).
      selector:
        entity:
          domain: light
    light_device:
      name: Light (Zigbee device)
      description: >
        The same light, selected as a ZHA device (not entity) - needed to send the
        native Move/Stop command for smooth dim-up. Pick the device that corresponds
        to the light entity above.
      selector:
        device:
          integration: zha
    endpoint_id:
      name: Endpoint ID
      description: >
        Usually 1. Check in ZHA -> Devices -> your light -> Zigbee Device Signature
        if unsure.
      default: 1
      selector:
        number:
          min: 1
          max: 20
          step: 1
    move_rate:
      name: Dim-up speed (units/sec)
      description: Higher = faster ramp when holding Up. Try 30-60.
      default: 40
      selector:
        number:
          min: 5
          max: 254
          step: 5
    step_pct:
      name: Brightness step per iteration when dimming down (%)
      default: 3
      selector:
        number:
          min: 1
          max: 20
          step: 1
    step_delay_ms:
      name: Delay between steps when dimming down (ms)
      default: 150
      selector:
        number:
          min: 50
          max: 1000
          step: 10
    transition_s:
      name: Transition per step when dimming down (s)
      description: >
        Should be shorter than or equal to "Delay between steps", otherwise dimming
        will feel jerky because the next step reads brightness before the previous
        transition has finished.
      default: 0.1
      selector:
        number:
          min: 0
          max: 2
          step: 0.05
    min_pct:
      name: Minimum brightness when dimming down (%)
      description: The light will never go below this value while holding the down button.
      default: 1
      selector:
        number:
          min: 0
          max: 20
          step: 1
    max_iterations:
      name: Max steps per hold-down (safety limit)
      description: Safety cap in case a "stop" event is ever missed.
      default: 60
      selector:
        number:
          min: 5
          max: 200
          step: 5
    on_color_temp_kelvin:
      name: "Default color when turning on (K)"
      description: >
        Native white temperature applied automatically whenever the light is
        turned on via short press Up. Independent of the color/temp presets below.
      default: 2700
      selector:
        number:
          min: 2000
          max: 6500
          step: 50
          unit_of_measurement: "K"
    color_1:
      name: "Color 1 (RGB)"
      default: [255, 147, 40]
      selector:
        color_rgb: {}
    color_2:
      name: "Color 2"
      default: [100, 150, 220]
      selector:
        color_rgb: {}
    color_3:
      name: "Color 3"
      default: [120, 180, 140]
      selector:
        color_rgb: {}
    color_4:
      name: "Color 4"
      default: [150, 110, 190]
      selector:
        color_rgb: {}
    temp_5:
      name: "Color 5: native white temperature (K)"
      description: Uses the light's dedicated white LEDs, not RGB. Default 2700K.
      default: 2700
      selector:
        number:
          min: 2000
          max: 6500
          step: 50
          unit_of_measurement: "K"
    temp_6:
      name: "Color 6: native white temperature (K)"
      description: Uses the light's dedicated white LEDs, not RGB. Default 4000K.
      default: 4000
      selector:
        number:
          min: 2000
          max: 6500
          step: 50
          unit_of_measurement: "K"
    color_transition_s:
      name: Color change transition (s)
      default: 1
      selector:
        number:
          min: 0
          max: 5
          step: 0.5
    arrow_left_arg:
      name: "Left arrow: args[0] value"
      description: >
        Verify in Developer Tools -> Events (listen to zha_event, press the left
        arrow) - some Styrbar firmware versions differ. Default matches most units.
      default: 257
      selector:
        number:
          min: 0
          max: 1000
          step: 1
    arrow_right_arg:
      name: "Right arrow: args[0] value"
      description: Same as above, for the right arrow.
      default: 256
      selector:
        number:
          min: 0
          max: 1000
          step: 1

mode: restart
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      command: "{{ trigger.event.data.command }}"
      args: "{{ trigger.event.data.args }}"
      light_entity: !input light
      light_device: !input light_device
      light_ieee: >-
        {{ (device_attr(light_device, 'identifiers') | list | first)[1] }}
      endpoint_id: !input endpoint_id
      move_rate: !input move_rate
      step_pct: !input step_pct
      step_delay_ms: !input step_delay_ms
      transition_s: !input transition_s
      min_pct: !input min_pct
      max_iterations: !input max_iterations
      color_transition_s: !input color_transition_s
      arrow_left_arg: !input arrow_left_arg
      arrow_right_arg: !input arrow_right_arg
      on_color_temp_kelvin: !input on_color_temp_kelvin
      color_1: !input color_1
      color_2: !input color_2
      color_3: !input color_3
      color_4: !input color_4
      temp_5: !input temp_5
      temp_6: !input temp_6
      colors: >-
        {{ [
          {'type': 'rgb', 'value': color_1},
          {'type': 'rgb', 'value': color_2},
          {'type': 'rgb', 'value': color_3},
          {'type': 'rgb', 'value': color_4},
          {'type': 'temp', 'value': temp_5},
          {'type': 'temp', 'value': temp_6}
        ] }}

  - choose:
      # --- Short press up -> turn on, always with the default on-color (native white) ---
      - conditions: "{{ command == 'on' }}"
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input light
            data:
              color_temp_kelvin: "{{ on_color_temp_kelvin }}"

      # --- Short press down -> turn off ---
      - conditions: "{{ command == 'off' }}"
        sequence:
          - service: light.turn_off
            target:
              entity_id: !input light

      # --- Hold up -> native Zigbee Move (hardware-ramped, smooth) ---
      - conditions: "{{ command == 'move_with_on_off' }}"
        sequence:
          - service: zha.issue_zigbee_cluster_command
            data:
              ieee: "{{ light_ieee }}"
              endpoint_id: "{{ endpoint_id }}"
              cluster_id: 8
              cluster_type: "in"
              command: 5
              command_type: "server"
              args: [0, "{{ move_rate }}"]

      # --- Hold down -> step-loop dim down, with floor ---
      - conditions: "{{ command == 'move' }}"
        sequence:
          - repeat:
              count: "{{ max_iterations }}"
              sequence:
                - variables:
                    cur_pct: >-
                      {{ (state_attr(light_entity, 'brightness') | int(0)) / 255 * 100 }}
                    target_pct: "{{ [cur_pct - step_pct, min_pct] | max | round(0) }}"
                - service: light.turn_on
                  target:
                    entity_id: !input light
                  data:
                    brightness_pct: "{{ target_pct }}"
                    transition: "{{ transition_s }}"
                - delay:
                    milliseconds: "{{ step_delay_ms }}"

      # --- Release -> native Stop for the Move command (also ends the down repeat via mode: restart) ---
      - conditions: "{{ command in ['stop', 'stop_with_on_off'] }}"
        sequence:
          - service: zha.issue_zigbee_cluster_command
            data:
              ieee: "{{ light_ieee }}"
              endpoint_id: "{{ endpoint_id }}"
              cluster_id: 8
              cluster_type: "in"
              command: 3
              command_type: "server"
              args: []

      # --- Right arrow (short press) -> next color in the list ---
      - conditions:
          - "{{ command == 'press' }}"
          - "{{ (args | list | first) == arrow_right_arg }}"
        sequence:
          - variables:
              current_mode: "{{ state_attr(light_entity, 'color_mode') }}"
              current_rgb: "{{ state_attr(light_entity, 'rgb_color') | list if current_mode == 'rgb' else [] }}"
              current_temp: "{{ state_attr(light_entity, 'color_temp_kelvin') if current_mode == 'color_temp' else -1 }}"
              current_index: >-
                {% set ns = namespace(idx=-1) %}
                {% for c in colors %}
                  {% if c.type == 'rgb' and current_mode == 'rgb' and (c.value | list) == current_rgb %}
                    {% set ns.idx = loop.index0 %}
                  {% elif c.type == 'temp' and current_mode == 'color_temp' and (c.value | int) == (current_temp | int) %}
                    {% set ns.idx = loop.index0 %}
                  {% endif %}
                {% endfor %}
                {{ ns.idx }}
              next_index: "{{ (current_index | int + 1) % (colors | length) }}"
              next_color: "{{ colors[next_index | int] }}"
          - choose:
              - conditions: "{{ next_color.type == 'rgb' }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input light
                    data:
                      rgb_color: "{{ next_color.value }}"
                      transition: "{{ color_transition_s }}"
              - conditions: "{{ next_color.type == 'temp' }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input light
                    data:
                      color_temp_kelvin: "{{ next_color.value }}"
                      transition: "{{ color_transition_s }}"

      # --- Left arrow (short press) -> previous color in the list ---
      - conditions:
          - "{{ command == 'press' }}"
          - "{{ (args | list | first) == arrow_left_arg }}"
        sequence:
          - variables:
              current_mode: "{{ state_attr(light_entity, 'color_mode') }}"
              current_rgb: "{{ state_attr(light_entity, 'rgb_color') | list if current_mode == 'rgb' else [] }}"
              current_temp: "{{ state_attr(light_entity, 'color_temp_kelvin') if current_mode == 'color_temp' else -1 }}"
              current_index: >-
                {% set ns = namespace(idx=-1) %}
                {% for c in colors %}
                  {% if c.type == 'rgb' and current_mode == 'rgb' and (c.value | list) == current_rgb %}
                    {% set ns.idx = loop.index0 %}
                  {% elif c.type == 'temp' and current_mode == 'color_temp' and (c.value | int) == (current_temp | int) %}
                    {% set ns.idx = loop.index0 %}
                  {% endif %}
                {% endfor %}
                {{ ns.idx }}
              prev_index: "{{ (current_index | int - 1) % (colors | length) }}"
              prev_color: "{{ colors[prev_index | int] }}"
          - choose:
              - conditions: "{{ prev_color.type == 'rgb' }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input light
                    data:
                      rgb_color: "{{ prev_color.value }}"
                      transition: "{{ color_transition_s }}"
              - conditions: "{{ prev_color.type == 'temp' }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id: !input light
                    data:
                      color_temp_kelvin: "{{ prev_color.value }}"
                      transition: "{{ color_transition_s }}"
